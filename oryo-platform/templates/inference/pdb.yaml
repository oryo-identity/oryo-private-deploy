{{- if and .Values.inference.enabled .Values.inference.pdb.enabled -}}
{{- $component := "inference" -}}
{{- $svc := .Values.inference -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oryo.componentName" (list . $component) }}
  labels:
    {{- include "oryo.componentLabels" (list . $component) | nindent 4 }}
spec:
  maxUnavailable: {{ $svc.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "oryo.componentSelectorLabels" (list . $component) | nindent 6 }}
{{- end }}
