# Default values for the oryo-platform chart.
# Override with -f values.custom.yaml or --set on the command line.

global:
  # ---------------------------------------------------------------------------
  # IMAGES: pulled from Oryo's GHCR. Create a pull secret from your GHCR token
  # (see docs/runbook.md) and reference it in imagePullSecrets.
  # ---------------------------------------------------------------------------
  imageRegistry: ghcr.io/oryo-identity
  imageTag: latest # default tag applied unless service.image.tag overrides
  imagePullPolicy: IfNotPresent
  imagePullSecrets: [] # e.g. [{ name: ghcr-pull }]

  nodeArchitecture: arm64

  # Create the `alb` IngressClass (EKS Auto Mode's built-in controller).
  # Set false if the class already exists in your cluster.
  createIngressClass: true
  ingressClassName: alb

  podLabels: {}

  env:
    ENV_NAME: stage # private-deploy chart default; `stage` is the private-deploy value (always)
    DOMAIN: 'example.com'                        # TODO
    APP_BASE_URL: 'https://app.example.com'      # TODO
    API_BASE_URL: 'https://api.example.com'      # TODO
    DEFAULT_BUCKET: 'example-bucket'             # TODO - s3 bucket
    DEFAULT_LLM: '' # optional Bedrock model ID for agents; empty = anthropic.claude-3-haiku-20240307-v1:0. e.g. amazon.nova-micro-v1:0
    LOGIN_CODE_FROM_EMAIL: noreply@oryo.io      # keep value if using an oryo provided Resend API Key
    SENSOR_DOWNLOAD_BASE_URL: '' # optional: serve sensor installs from Oryo's public bucket. e.g. https://binaries-pub-prod-us-east-1-oryo.s3.amazonaws.com
    ORYO_ENTRA_APP_ID: ''                        # optional — Microsoft Purview DLP integration; see docs/runbook.md

    # Optional cloud-partition / endpoint overrides — the app defaults to the
    # commercial AWS and Microsoft clouds. Set only for GovCloud or sovereign
    # deployments (docs/runbook.md "Cloud partition and endpoint overrides").
    # Empty values are dropped from pods, so the in-app defaults apply.
    AWS_REGION: ''               # e.g. us-gov-west-1; on EKS leave empty — IRSA injects the cluster region
    AWS_S3_SUFFIX: ''            # S3 endpoint suffix; app default s3.amazonaws.com
    MICROSOFT_AUTHORITY: ''      # e.g. https://login.microsoftonline.us
    MICROSOFT_GRAPH: ''          # e.g. https://graph.microsoft.us
    MICROSOFT_ARM: ''            # e.g. https://management.usgovcloudapi.net
    MICROSOFT_COGNITIVE_SUFFIX: '' # e.g. cognitiveservices.azure.us
    MICROSOFT_AI_FOUNDRY: ''     # your cloud's AI Foundry endpoint URL

  # Database connection (shared across services). Per-service `db.user`/`db.role`
  db:
    host: ''                                     # TODO
    port: 5432
    database: postgres
    sslmode: require

  # env-var -> { secretName, key } for secrets managed outside the chart
  # (ESO, SealedSecrets, CSI driver).
  externalSecrets:
    SESSION_SECRET:
      secretName: oryo-session-secret
      key: value
    # Uncomment to enable the Microsoft Purview DLP integration (also set
    # ORYO_ENTRA_APP_ID above). See docs/runbook.md "Microsoft Purview DLP
    # integration". The secret must exist or pods fail to start.
    # ORYO_ENTRA_APP_SECRET:
    #   secretName: oryo-entra-app-secret
    #   key: value

# Sensor compatibility range served to clients (stamped at release).
sensor:
  versionRange: ''

# -----------------------------------------------------------------------------
# ServiceAccount: used by all workloads. Annotate with an IAM role ARN for
# IRSA on EKS so pods get S3 + Bedrock access without static credentials.
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: oryo-platform           # MUST match the SA in your IAM role's IRSA trust policy
  annotations:
    eks.amazonaws.com/role-arn: ''

# -----------------------------------------------------------------------------
# Database initialization: runs the @service/db-init image to create roles,
# tables, RLS policies, and the default tenant. Idempotent.
# -----------------------------------------------------------------------------
dbInit:
  enabled: true
  mode: hook                       # hook | manual | disabled
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  resources: {}

  image:
    repository: db-init

  # Postgres admin (superuser) credentials. Required for CREATE/ALTER ROLE.
  adminSecret:
    name: oryo-db-admin
    userKey: username
    passwordKey: password

  passwordSecrets:
    DASHBOARD_USER_PASSWORD: { secretName: oryo-db-dashboard, key: password }
    GATEWAY_USER_PASSWORD:   { secretName: oryo-db-gateway,   key: password }
    WORKER_USER_PASSWORD:    { secretName: oryo-db-worker,    key: password }

  # Your Tenant Details.
  defaultTenant:
    name: '' # e.g. "Acme Corp"
    owner: '' # e.g. admin@acme.com

# -----------------------------------------------------------------------------
# Dashboard: Oryo Platform UI.
# -----------------------------------------------------------------------------
dashboard:
  enabled: true
  image:
    repository: dashboard
  replicas: 2
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  ingress:
    enabled: true
    className: alb
    host: ''                                           # TODO
    annotations: &albAnnotations
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/certificate-arn: ''    # TODO
      alb.ingress.kubernetes.io/group.name: oryo
      alb.ingress.kubernetes.io/healthcheck-path: /healthcheck
  db:
    user: oryo-dashboard
    passwordSecret: { name: oryo-db-dashboard, key: password }
  # Email login codes via Resend. Requires RESEND_API_KEY
  externalSecrets:
    RESEND_API_KEY: { secretName: oryo-resend-api-key, key: value }

# -----------------------------------------------------------------------------
# Gateway: AI traffic inspector
# -----------------------------------------------------------------------------
gateway:
  enabled: true
  image:
    repository: gateway
  replicas: 2
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  ingress:
    enabled: true
    className: alb
    host: gateway.example.com                          # TODO
    annotations: *albAnnotations
  db:
    user: oryo-gateway
    passwordSecret: { name: oryo-db-gateway, key: password }

# -----------------------------------------------------------------------------
# Inference: GPU model serving — PII/PHI detection behind the "PII scan" policy
# function. Optional; requires an NVIDIA GPU node (see docs/inference-gpu.md).
# When disabled or unready, PII-scan rules skip and requests are allowed
# (fail-open) — everything else works without it.
# -----------------------------------------------------------------------------
inference:
  enabled: false
  replicas: 1
  image:
    repository: inference
  containerPort: 3005
  service:
    type: ClusterIP
    port: 80
  # amd64-only image (CUDA has no arm builds) — overrides the chart-wide arm64 affinity
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: ['amd64']
  # match the labels/taints on the GPU NodePool from docs/inference-gpu.md
  nodeSelector:
    oryo.io/role: gpu
  tolerations:
    - key: oryo.io/workload
      operator: Equal
      value: gpu
      effect: NoSchedule
  resources:
    requests:
      cpu: '1'
      memory: 3Gi
      nvidia.com/gpu: 1
    limits:
      cpu: '2'
      memory: 4Gi
      nvidia.com/gpu: 1
  pdb:
    enabled: true
    # minAvailable would block node drains at 1 replica
    maxUnavailable: 1
  env: {}
  # unused by the service — the shared env bootstrap requires DB_* on every pod
  db:
    user: oryo-gateway
    passwordSecret: { name: oryo-db-gateway, key: password }
  # a pod mid-scan is slow, not dead
  livenessProbe:
    httpGet:
      path: /healthcheck
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /healthcheck
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # model load can take minutes on first boot
  startupProbe:
    httpGet:
      path: /healthcheck
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60

workers:
  enabled: true
  image:
    repository: workers
  replicas: 1
  resources: {}
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  tmpVolume:
    enabled: false
  db:
    user: oryo-worker
    passwordSecret: { name: oryo-db-worker, key: password }

api:
  enabled: true
  image:
    repository: api
  replicas: 2
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  ingress:
    enabled: true
    className: alb
    host: api.example.com                            # TODO
    annotations: *albAnnotations
  db:
    user: oryo-dashboard
    passwordSecret: { name: oryo-db-dashboard, key: password }

